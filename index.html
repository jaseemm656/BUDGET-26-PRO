<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Finance Tracker Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#f1f5f9;padding-bottom:90px;min-height:100vh}
.hdr{background:linear-gradient(135deg,#1d4ed8,#7c3aed);padding:16px 18px;position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 12px rgba(0,0,0,.4)}
.hdr-left h1{font-size:18px;font-weight:800;letter-spacing:.3px}
.hdr-left p{font-size:11px;color:#bfdbfe;margin-top:1px}
.save-hdr-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:white;padding:8px 14px;border-radius:9px;font-size:18px;cursor:pointer}
.mon-nav{background:#1e293b;margin:12px;border-radius:11px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
.mon-nav button{background:#334155;border:none;color:white;width:36px;height:36px;border-radius:8px;font-size:16px;cursor:pointer}
.mon-name{font-weight:700;font-size:15px}
.wrap{padding:0 12px}
.card{background:#1e293b;border-radius:13px;padding:15px;margin-bottom:12px}
.card-hdr{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.btn{padding:10px 16px;border-radius:9px;border:none;font-size:13px;font-weight:600;cursor:pointer}
.btn-blue{background:#2563eb;color:white}
.btn-green{background:#16a34a;color:white}
.btn-gray{background:#475569;color:white}
.btn-red{background:#dc2626;color:white}
.btn-yellow{background:#b45309;color:white}
.btn-purple{background:#7c3aed;color:white}
.btn-sm{padding:5px 10px;border-radius:7px;font-size:12px;font-weight:700;border:none;cursor:pointer;white-space:nowrap}
.inp{width:100%;padding:9px 11px;background:#334155;border:1px solid #475569;border-radius:8px;color:white;font-size:14px;outline:none}
.inp:focus{border-color:#3b82f6}
.inp::placeholder{color:#64748b}
select.inp{cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #0f172a}
.row:last-child{border-bottom:none}
.lbl{color:#94a3b8;font-size:13px}
.val{font-weight:700;font-size:14px}
.g-red{color:#ef4444}.g-green{color:#10b981}.g-yellow{color:#fbbf24}.g-blue{color:#60a5fa}.g-purple{color:#a78bfa}.g-orange{color:#fb923c}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
.b-green{background:rgba(16,185,129,.2);color:#10b981;border:1px solid #10b981}
.b-yellow{background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid #f59e0b}
.b-red{background:rgba(220,38,38,.2);color:#ef4444;border:1px solid #dc2626}
.b-blue{background:rgba(37,99,235,.2);color:#60a5fa;border:1px solid #3b82f6}
.b-gray{background:rgba(71,85,105,.3);color:#94a3b8}
.pitem{background:#0f172a;border-radius:10px;padding:12px;margin-bottom:8px;border-left:4px solid #334155}
.pitem.paid{border-left-color:#10b981;background:rgba(6,78,59,.15)}
.pitem.unpaid{border-left-color:#f59e0b}
.pitem.overdue{border-left-color:#dc2626;background:rgba(127,29,29,.15)}
.progress{background:#1e293b;border-radius:99px;height:6px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#10b981);transition:width .3s}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#1e293b;border-top:1px solid #334155;display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch}
.nb{flex:1;min-width:56px;padding:9px 4px 11px;background:none;border:none;color:#64748b;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .2s}
.nb.on{background:#2563eb;color:white}
.nb .ni{font-size:18px}
.nb .nl{font-size:9px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:#10b981;color:white;padding:10px 20px;border-radius:9px;font-weight:700;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1}
.divider{font-size:10px;color:#475569;text-align:center;padding:5px 0 8px;letter-spacing:1.2px;text-transform:uppercase;border-top:1px dashed #334155;margin:5px 0 8px}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <h1>💰 Finance Tracker Pro</h1>
    <p id="savedLbl">Loading…</p>
  </div>
  <button class="save-hdr-btn" onclick="manualSave()">💾</button>
</div>

<div class="mon-nav">
  <button onclick="chMon(-1)">◀</button>
  <div class="mon-name" id="monName"></div>
  <button onclick="chMon(1)">▶</button>
</div>

<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<nav class="bottom-nav" id="nav"></nav>

<script>
// ─── STATE ───────────────────────────────────────────────────────────────────
function todayMon(){const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');}

let S = {
  tab:'monthly',
  month: todayMon(),
  income: 11600,
  emis:[
    {id:1,name:'DIB Loan',    emi:3326,   tenure:48,paid:27,paidAmt:89802,  balMon:21,balAmt:69846,   due:3,  start:'2024-03-03',end:'2028-02-03',cleared:false},
    {id:2,name:'DIB CC1',     emi:454.21, tenure:36,paid:11,paidAmt:4996.31,balMon:25,balAmt:11355.25,due:3,  start:'2025-07-03',end:'2028-06-03',cleared:false},
    {id:3,name:'DIB CC2',     emi:99.43,  tenure:36,paid:11,paidAmt:1093.73,balMon:25,balAmt:2485.75, due:3,  start:'2025-07-03',end:'2028-06-03',cleared:false},
    {id:4,name:'ENBD CC',     emi:1474.66,tenure:15,paid:15,paidAmt:22119.9,balMon:0, balAmt:0,       due:10, start:'2024-12-31',end:'2026-02-10',cleared:true},
    {id:5,name:'EIB CC',      emi:1226.60,tenure:15,paid:4, paidAmt:4906.4, balMon:11,balAmt:13492.60,due:30, start:'2026-01-30',end:'2027-03-30',cleared:false},
    {id:6,name:'CashNow App', emi:920,    tenure:3, paid:1, paidAmt:920,    balMon:2, balAmt:1840,    due:18, start:'2026-05-18',end:'2026-07-18',cleared:false},
  ],
  debts:[
    {id:1,person:'Vibin',   total:60,   paidAmt:0,   bal:60},
    {id:2,person:'Hafeel',  total:4450, paidAmt:2000,bal:2450},
    {id:3,person:'Sherilka',total:5000, paidAmt:0,   bal:5000},
    {id:4,person:'Sadiq',   total:1650, paidAmt:0,   bal:1650},
    {id:5,person:'Divin',   total:1500, paidAmt:750, bal:750},
    {id:6,person:'Fasil',   total:200,  paidAmt:0,   bal:200},
  ],
  utilities:[
    {id:1,name:'Rent',    icon:'🏠',due:15,fixed:1916.66},
    {id:2,name:'DEWA',    icon:'⚡',due:20,fixed:0},
    {id:3,name:'Chiller', icon:'❄️',due:25,fixed:0},
    {id:4,name:'Gas',     icon:'🔥',due:15,fixed:0},
    {id:5,name:'WiFi',    icon:'📶',due:10,fixed:100},
    {id:6,name:'Mobile',  icon:'📱',due:5, fixed:72},
    {id:7,name:'Home',    icon:'🏡',due:1, fixed:0},
    {id:8,name:'Zuu',     icon:'💪',due:1, fixed:0},
  ],
  // Per-month data: utilBills[YYYY-MM][utilId] = {amt, paid}
  utilBills:{},
  // Per-month EMI paid: emiPaid[YYYY-MM][emiId] = true/false
  emiPaid:{},
  // Monthly expenses: expenses[YYYY-MM] = [{id,cat,amt,note,date}]
  expenses:{},
  editIncome:false,
  lastSaved:null
};

// ─── STORAGE ─────────────────────────────────────────────────────────────────
function save(){
  try{
    S.lastSaved=new Date().toISOString();
    localStorage.setItem('ftp_v3',JSON.stringify(S));
    updSaved();return true;
  }catch(e){return false;}
}
function load(){
  try{
    const d=localStorage.getItem('ftp_v3');
    if(d){
      const p=JSON.parse(d);
      S=Object.assign({},S,p,{tab:S.tab,editIncome:false});
      if(!S.emiPaid)S.emiPaid={};
      if(!S.utilBills)S.utilBills={};
      if(!S.expenses)S.expenses={};
    }
    save();
  }catch(e){}
}
function manualSave(){if(save())toast('💾 Saved!');}
function updSaved(){
  const el=document.getElementById('savedLbl');
  if(!el)return;
  if(S.lastSaved){const d=new Date(S.lastSaved);el.textContent='Saved '+d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
}
function toast(m,e){
  const el=document.getElementById('toast');
  el.textContent=m;el.style.background=e?'#dc2626':'#10b981';
  el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200);
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function fmt(n){return(+n||0).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:0});}
function f2(n){return(+n||0).toFixed(2);}
function ord(n){return n+(n==1?'st':n==2?'nd':n==3?'rd':'th');}
function monLabel(m){const[y,mo]=m.split('-');return new Date(y,mo-1).toLocaleDateString('en-US',{month:'long',year:'numeric'});}
function chMon(d){
  const[y,m]=S.month.split('-').map(Number);
  const dt=new Date(y,m-1+d,1);
  S.month=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');
  save();render();
}

// ─── MONTH DATA HELPERS ───────────────────────────────────────────────────────
function getEmiPaid(emiId){return !!(S.emiPaid[S.month]&&S.emiPaid[S.month][emiId]);}
function setEmiPaid(emiId,val){
  if(!S.emiPaid[S.month])S.emiPaid[S.month]={};
  S.emiPaid[S.month][emiId]=val;
}
function getUtil(uid){return(S.utilBills[S.month]||{})[uid]||{amt:0,paid:false};}
function setUtil(uid,data){
  if(!S.utilBills[S.month])S.utilBills[S.month]={};
  S.utilBills[S.month][uid]=Object.assign(getUtil(uid),data);
}
function getExps(){return S.expenses[S.month]||[];}

// ─── CALC ─────────────────────────────────────────────────────────────────────
function calc(){
  const emiPaidAmt = S.emis.filter(e=>!e.cleared&&getEmiPaid(e.id)).reduce((s,e)=>s+e.emi,0);
  const utilPaidAmt = S.utilities.reduce((s,u)=>{const b=getUtil(u.id);return s+(b.paid?b.amt:0);},0);
  const expAmt = getExps().reduce((s,e)=>s+e.amt,0);
  const totalPaid = emiPaidAmt+utilPaidAmt+expAmt;
  const balance = S.income - totalPaid;
  // Pending (not yet paid)
  const emiPending = S.emis.filter(e=>!e.cleared&&!getEmiPaid(e.id)).reduce((s,e)=>s+e.emi,0);
  const utilPending = S.utilities.reduce((s,u)=>{const b=getUtil(u.id);return s+(b.amt>0&&!b.paid?b.amt:0);},0);
  const totalDebt = S.debts.reduce((s,d)=>s+d.bal,0);
  const totalEmiBal = S.emis.reduce((s,e)=>s+e.balAmt,0);
  return{emiPaidAmt,utilPaidAmt,expAmt,totalPaid,balance,emiPending,utilPending,totalDebt,totalEmiBal};
}

// ─── MONTHLY TAB ─────────────────────────────────────────────────────────────
function renderMonthly(){
  const c=calc();
  const today=new Date().getDate();
  let html='';

  // ── Income Card ──
  html+=
    '<div class="card" style="background:linear-gradient(135deg,#1e3a5f,#312e81);margin-bottom:12px">'+
      '<div style="display:flex;justify-content:space-between;align-items:center">'+
        '<div>'+
          '<div style="font-size:10px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px">Monthly Income</div>'+
          '<div style="font-size:32px;font-weight:800;color:#6ee7b7">AED '+fmt(S.income)+'</div>'+
        '</div>'+
        '<button onclick="S.editIncome=!S.editIncome;render()" style="background:rgba(255,255,255,.12);border:none;color:white;padding:8px 12px;border-radius:9px;font-size:16px;cursor:pointer">✏️</button>'+
      '</div>'+
      (S.editIncome?
        '<div style="display:flex;gap:8px;margin-top:12px">'+
          '<input type="number" id="incInp" value="'+S.income+'" class="inp" style="flex:1">'+
          '<button onclick="S.income=parseFloat(document.getElementById(\'incInp\').value)||S.income;S.editIncome=false;save();render()" class="btn btn-green" style="padding:9px 14px">Save</button>'+
          '<button onclick="S.editIncome=false;render()" class="btn btn-gray" style="padding:9px 12px">✕</button>'+
        '</div>':'') +
    '</div>';

  // ── Balance Status ──
  html+=
    '<div style="background:'+(c.balance>=0?'rgba(16,185,129,.12)':'rgba(220,38,38,.12)')+';border:2px solid '+(c.balance>=0?'#10b981':'#ef4444')+';border-radius:13px;padding:14px;margin-bottom:12px">'+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'+
        '<div style="text-align:center">'+
          '<div style="font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">Paid Out</div>'+
          '<div style="font-size:22px;font-weight:800;color:#ef4444">AED '+fmt(c.totalPaid)+'</div>'+
        '</div>'+
        '<div style="text-align:center">'+
          '<div style="font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">'+(c.balance>=0?'In Hand':'Overspent')+'</div>'+
          '<div style="font-size:22px;font-weight:800;color:'+(c.balance>=0?'#10b981':'#ef4444')+'">AED '+fmt(Math.abs(c.balance))+'</div>'+
        '</div>'+
      '</div>'+
      ((c.emiPending+c.utilPending)>0?
        '<div style="margin-top:10px;padding-top:10px;border-top:1px solid #334155">'+
          '<div style="display:flex;justify-content:space-between">'+
            '<span style="font-size:12px;color:#f59e0b">⏳ Still to pay</span>'+
            '<span style="font-size:13px;font-weight:700;color:#f59e0b">AED '+fmt(c.emiPending+c.utilPending)+'</span>'+
          '</div>'+
          '<div style="display:flex;justify-content:space-between;margin-top:3px">'+
            '<span style="font-size:11px;color:#64748b">After all paid</span>'+
            '<span style="font-size:12px;font-weight:700;color:'+(c.balance-(c.emiPending+c.utilPending)>=0?'#10b981':'#ef4444')+'">AED '+fmt(c.balance-(c.emiPending+c.utilPending))+'</span>'+
          '</div>'+
        '</div>':'') +
    '</div>';

  // ── Waterfall ──
  html+='<div style="background:#1e293b;border-radius:13px;overflow:hidden;margin-bottom:12px">';
  html+='<div style="padding:11px 14px;background:linear-gradient(90deg,#1d4ed8,#7c3aed);display:flex;justify-content:space-between"><span style="font-weight:700;font-size:14px">💸 Payment Waterfall</span><span style="font-size:11px;color:rgba(255,255,255,.5)">tap to mark paid</span></div>';
  html+='<div style="background:rgba(16,185,129,.08);padding:11px 14px;border-bottom:1px solid #0f172a;display:flex;justify-content:space-between"><span style="font-weight:700;color:#6ee7b7;font-size:13px">🟢 Income</span><span style="font-size:17px;font-weight:800;color:#6ee7b7">AED '+fmt(S.income)+'</span></div>';

  let runBal=S.income;

  // EMIs
  S.emis.filter(e=>!e.cleared).forEach(e=>{
    const paid=getEmiPaid(e.id);
    if(paid)runBal-=e.emi;
    const balC=runBal>=0?'#10b981':'#ef4444';
    const diff=e.due-today;
    const badge=paid?'<span class="badge b-green">✅ PAID</span>':(diff<0?'<span class="badge b-red">OVERDUE</span>':diff<=3?'<span class="badge b-yellow">DUE SOON</span>':'<span class="badge b-blue">DUE '+ord(e.due)+'</span>');
    html+=
      '<div style="padding:12px 14px;border-bottom:1px solid #0f172a;background:'+(paid?'rgba(16,185,129,.05)':'')+'">'+
        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">'+
          '<div style="font-size:19px">📅</div>'+
          '<div style="flex:1"><div style="font-size:13px;font-weight:700">'+e.name+'</div><div style="font-size:11px;color:#64748b">EMI • AED '+fmt(e.emi)+'/mo • '+e.balMon+' mo left</div></div>'+
          '<div style="text-align:right"><div style="font-size:14px;font-weight:800;color:'+(paid?'#10b981':'#f59e0b')+'">'+(paid?'— ':'')+' AED '+fmt(e.emi)+'</div>'+badge+'</div>'+
        '</div>'+
        '<div style="display:flex;justify-content:space-between;align-items:center;padding-top:7px;border-top:1px solid #0f172a">'+
          (paid?
            '<button onclick="toggleEmi('+e.id+')" class="btn-sm" style="background:rgba(6,78,59,.5);border:1px solid #10b981;color:#10b981">✅ Paid — Undo ↩️</button>':
            '<button onclick="toggleEmi('+e.id+')" class="btn-sm btn-blue">Mark Paid ✓</button>')+
          '<div style="text-align:right"><div style="font-size:10px;color:#64748b">Balance after</div><div style="font-size:14px;font-weight:800;color:'+balC+'">AED '+fmt(runBal)+'</div></div>'+
        '</div>'+
      '</div>';
  });

  // Utilities
  html+='<div style="padding:6px 14px;background:#0f172a;font-size:10px;font-weight:700;color:#64748b;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid #1e293b">🏠 Utilities & Bills</div>';
  S.utilities.forEach(u=>{
    const b=getUtil(u.id);
    const isPaid=b.paid&&b.amt>0;
    const hasAmt=b.amt>0;
    if(isPaid)runBal-=b.amt;
    const balC=runBal>=0?'#10b981':'#ef4444';
    const diff=u.due-today;
    const badge=isPaid?'<span class="badge b-green">✅ PAID</span>':(diff<0&&hasAmt?'<span class="badge b-red">OVERDUE</span>':diff<=3&&hasAmt?'<span class="badge b-yellow">DUE SOON</span>':'<span class="badge b-gray">DUE '+ord(u.due)+'</span>');
    html+=
      '<div style="padding:11px 14px;border-bottom:1px solid #0f172a;background:'+(isPaid?'rgba(16,185,129,.04)':'')+'">'+
        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">'+
          '<div style="font-size:19px">'+u.icon+'</div>'+
          '<div style="flex:1"><div style="font-size:13px;font-weight:700">'+u.name+'</div><div style="font-size:11px;color:#64748b">Due '+ord(u.due)+(u.fixed>0?' • Fixed AED '+fmt(u.fixed):'')+'</div></div>'+
          '<div style="text-align:right">'+
            (hasAmt?'<div style="font-size:14px;font-weight:800;color:'+(isPaid?'#10b981':'#f59e0b')+'">'+(isPaid?'— ':'')+' AED '+fmt(b.amt)+'</div>':
              '<input type="number" placeholder="Enter AED" onblur="setUtil('+u.id+',{amt:parseFloat(this.value)||0});save();render()" style="width:90px;padding:4px 7px;background:#334155;border:1px solid #475569;border-radius:7px;color:white;font-size:12px;text-align:right"'+(u.fixed>0?' value="'+u.fixed+'"':'')+'>')+
            badge+
          '</div>'+
        '</div>'+
        '<div style="display:flex;justify-content:space-between;align-items:center;padding-top:7px;border-top:1px solid #0f172a">'+
          (isPaid?
            '<button onclick="setUtil('+u.id+',{paid:false});save();render()" class="btn-sm" style="background:rgba(6,78,59,.5);border:1px solid #10b981;color:#10b981">✅ Paid — Undo ↩️</button>':
            (hasAmt?
              '<button onclick="setUtil('+u.id+',{paid:true});save();render()" class="btn-sm btn-yellow">Mark Paid ✓</button>':
              '<span style="font-size:11px;color:#64748b">Enter amount above first</span>'
            ))+
          '<div style="text-align:right"><div style="font-size:10px;color:#64748b">Balance after</div><div style="font-size:14px;font-weight:800;color:'+balC+'">AED '+fmt(runBal)+'</div></div>'+
        '</div>'+
      '</div>';
  });

  // Expenses
  const exps=getExps();
  html+='<div style="padding:6px 14px;background:#0f172a;font-size:10px;font-weight:700;color:#64748b;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid #1e293b">📊 Other Expenses</div>';
  if(exps.length===0){
    html+='<div style="padding:14px;color:#64748b;font-size:13px">No expenses yet — add below</div>';
  } else {
    exps.slice().reverse().forEach(ex=>{
      runBal-=ex.amt;
      const balC=runBal>=0?'#10b981':'#ef4444';
      html+=
        '<div style="padding:11px 14px;border-bottom:1px solid #0f172a;background:rgba(168,85,247,.04)">'+
          '<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">'+
            '<div style="font-size:19px">📊</div>'+
            '<div style="flex:1"><div style="font-size:13px;font-weight:700">'+ex.cat+'</div><div style="font-size:11px;color:#64748b">'+(ex.note||'Expense')+' • '+new Date(ex.date).toLocaleDateString('en-GB',{day:'numeric',month:'short'})+'</div></div>'+
            '<div style="text-align:right"><div style="font-size:14px;font-weight:800;color:#a78bfa">— AED '+fmt(ex.amt)+'</div><span class="badge b-gray">SPENT</span></div>'+
          '</div>'+
          '<div style="display:flex;justify-content:space-between;align-items:center;padding-top:7px;border-top:1px solid #0f172a">'+
            '<button onclick="delExp('+ex.id+')" class="btn-sm" style="background:#450a0a;border:none;color:#fca5a5">🗑️ Delete</button>'+
            '<div style="text-align:right"><div style="font-size:10px;color:#64748b">Balance after</div><div style="font-size:14px;font-weight:800;color:'+balC+'">AED '+fmt(runBal)+'</div></div>'+
          '</div>'+
        '</div>';
    });
  }

  // Final balance
  html+='<div style="padding:14px;background:'+(c.balance>=0?'rgba(16,185,129,.12)':'rgba(220,38,38,.12)')+';display:flex;justify-content:space-between;align-items:center;border-top:2px solid '+(c.balance>=0?'#10b981':'#ef4444')+'">'+
    '<div><div style="font-size:14px;font-weight:700;color:'+(c.balance>=0?'#10b981':'#ef4444')+'">'+(c.balance>=0?'✅ Balance in Hand':'⚠️ Overspent')+'</div><div style="font-size:11px;color:#64748b">Based on payments marked</div></div>'+
    '<div style="font-size:24px;font-weight:800;color:'+(c.balance>=0?'#10b981':'#ef4444')+'">AED '+fmt(c.balance)+'</div>'+
  '</div>';
  html+='</div>';

  // ── Add Expense ──
  const cats=['Family Support','Food & Groceries','Transportation','Entertainment','Healthcare','Clothing','Personal Care','Other'];
  html+=
    '<div class="card">'+
      '<div class="card-hdr">➕ Add Expense</div>'+
      '<div style="display:flex;flex-direction:column;gap:8px">'+
        '<select id="e-cat" class="inp">'+cats.map(c=>'<option>'+c+'</option>').join('')+'</select>'+
        '<div style="display:flex;gap:8px">'+
          '<input type="number" id="e-amt" class="inp" placeholder="Amount (AED)" style="flex:1">'+
          '<input type="text" id="e-note" class="inp" placeholder="Note" style="flex:1">'+
        '</div>'+
        '<button class="btn btn-purple" style="width:100%" onclick="addExp()">Add Expense</button>'+
      '</div>'+
    '</div>';

  return html;
}

function toggleEmi(id){
  const was=getEmiPaid(id);
  setEmiPaid(id,!was);
  const e=S.emis.find(x=>x.id===id);
  if(!was){
    // Marking paid — advance loan
    if(e&&e.balMon>0){e.paid++;e.paidAmt+=e.emi;e.balMon--;e.balAmt=Math.max(0,e.balAmt-e.emi);}
    if(e&&e.balMon===0)e.cleared=true;
    toast('✅ '+e.name+' paid — AED '+fmt(e.emi)+' deducted');
  } else {
    // Undo
    if(e&&e.paid>0){e.paid--;e.paidAmt-=e.emi;e.balMon++;e.balAmt+=e.emi;e.cleared=false;}
    toast('↩️ Undone — AED '+fmt(e.emi)+' added back');
  }
  save();render();
}

function addExp(){
  const cat=document.getElementById('e-cat').value;
  const amt=parseFloat(document.getElementById('e-amt').value);
  const note=document.getElementById('e-note').value.trim();
  if(!(amt>0)){toast('Enter an amount','err');return;}
  if(!S.expenses[S.month])S.expenses[S.month]=[];
  S.expenses[S.month].push({id:Date.now(),cat,amt,note,date:new Date().toISOString()});
  save();toast('✅ Expense added');render();
}

function delExp(id){
  if(!S.expenses[S.month])return;
  S.expenses[S.month]=S.expenses[S.month].filter(e=>e.id!==id);
  save();toast('🗑️ Deleted');render();
}

    '<div style="font-size:12px;color:#94a3b8;margin-top:4px">Monthly Total: AED '+fmt(active.reduce((s,e)=>s+e.emi,0))+'/mo</div>'+
  '</div>';

            '<div style="font-size:11px;color:#64748b">Due '+ord(e.due)+' every month</div>'+
            '<div style="font-size:11px;color:#64748b">'+e.start+' → '+e.end+'</div>'+
          '</div>'+

          '<div style="background:#0f172a;border-radius:8px;padding:10px;text-align:center"><div style="font-size:11px;color:#64748b;margin-bottom:2px">Monthly</div><div style="font-size:16px;font-weight:700;color:#fbbf24">AED '+fmt(e.emi)+'</div></div>'+
          '<div style="background:#0f172a;border-radius:8px;padding:10px;text-align:center"><div style="font-size:11px;color:#64748b;margin-bottom:2px">Balance</div><div style="font-size:16px;font-weight:700;color:#f97316">AED '+fmt(e.balAmt)+'</div></div>'+
          '<div style="background:#0f172a;border-radius:8px;padding:10px;text-align:center"><div style="font-size:11px;color:#64748b;margin-bottom:2px">Months Left</div><div style="font-size:16px;font-weight:700;color:#a78bfa">'+e.balMon+'</div></div>'+
          '<div style="background:#0f172a;border-radius:8px;padding:10px;text-align:center"><div style="font-size:11px;color:#64748b;margin-bottom:2px">Progress</div><div style="font-size:16px;font-weight:700;color:#60a5fa">'+e.paid+'/'+e.tenure+'</div></div>'+
        '</div>'+
        '<div class="progress"><div class="progress-fill" style="width:'+pct+'%"></div></div>'+
        '<div style="margin-top:10px;display:flex;gap:8px">'+
          (paid?

          '<div style="display:flex;justify-content:space-between"><div><div style="font-size:14px;font-weight:700">'+e.name+'</div><div style="font-size:11px;color:#64748b">Fully Paid ✅</div></div><span class="badge b-green">CLEARED</span></div>'+

          '<div style="text-align:right"><div style="font-size:17px;font-weight:800;color:#f97316">AED '+fmt(d.bal)+'</div><div style="font-size:10px;color:#64748b">remaining</div></div>'+

          '<div style="display:flex;justify-content:space-between"><div style="font-size:14px;font-weight:700">'+d.person+'</div><span class="badge b-green">CLEARED ✅</span></div>'+

function addDebt(){
  const person=document.getElementById('d-name').value.trim();
  const amt=parseFloat(document.getElementById('d-amt').value);
  if(!person||!(amt>0)){toast('Fill name & amount','err');return;}
  const exists=S.debts.find(d=>d.person.toLowerCase()===person.toLowerCase());
  if(exists){exists.total+=amt;exists.bal+=amt;}
  else S.debts.push({id:Date.now(),person,total:amt,paidAmt:0,bal:amt});
  save();toast('✅ Added');render();
}

function payDebt(id){
  const d=S.debts.find(x=>x.id===id);
  const amt=parseFloat(document.getElementById('dp-'+id).value);
  if(!d||!(amt>0))return;
  d.paidAmt+=amt;d.bal=Math.max(0,d.bal-amt);
  save();toast('✅ AED '+fmt(amt)+' paid to '+d.person);render();
}

          '<div style="display:flex;align-items:center;gap:10px">'+
            '<div style="font-size:26px">'+u.icon+'</div>'+
            '<div><div style="font-size:14px;font-weight:700">'+u.name+'</div><div style="font-size:11px;color:#64748b">Due '+ord(u.due)+(u.fixed>0?' • Default AED '+fmt(u.fixed):'')+'</div></div>'+
          '</div>'+badge+
        '</div>'+
        '<div style="display:flex;gap:8px;margin-bottom:8px;align-items:center">'+
          '<input type="number" id="u-'+u.id+'" class="inp" value="'+(b.amt||u.fixed||'')+'" placeholder="Bill amount (AED)" style="flex:1" oninput="setUtil('+u.id+',{amt:parseFloat(this.value)||0})">'+
          '<button onclick="setUtil('+u.id+',{amt:parseFloat(document.getElementById(\'u-'+u.id+'\').value)||0});save();render()" class="btn btn-yellow" style="padding:9px 12px">Save</button>'+
        '</div>'+
        (b.amt>0?
          '<button onclick="setUtil('+u.id+',{paid:'+(!isPaid)+'});save();render()" class="btn '+(isPaid?'btn-gray':'btn-green')+'" style="width:100%">'+
            (isPaid?'↩️ Mark as Unpaid (adds back AED '+fmt(b.amt)+')':'✅ Mark as Paid (deducts AED '+fmt(b.amt)+')')+
          '</button>':
          '<p style="font-size:12px;color:#64748b">Enter bill amount and save to mark paid</p>'
        )+
      '</div>';
  });

  // Add utility
  html+=
    '<div class="card">'+
      '<div class="card-hdr">➕ Add Utility</div>'+
      '<div style="display:flex;flex-direction:column;gap:8px">'+
        '<input type="text" id="u-name" class="inp" placeholder="Name (e.g. Gym)">'+
        '<div style="display:flex;gap:8px">'+
          '<input type="text" id="u-icon" class="inp" placeholder="Icon emoji" style="width:70px;flex:none">'+
          '<input type="number" id="u-due" class="inp" placeholder="Due day" style="flex:1">'+

        '</div>'+
        '<button class="btn btn-blue" onclick="addUtil()">Add</button>'+
      '</div>'+
    '</div>';
  return html;
}

function addUtil(){
  const name=document.getElementById('u-name').value.trim();
  const icon=document.getElementById('u-icon').value.trim()||'💡';
  const due=parseInt(document.getElementById('u-due').value)||1;
  const fixed=parseFloat(document.getElementById('u-fixed').value)||0;
  if(!name)return;
  S.utilities.push({id:Date.now(),name,icon,due,fixed});
  save();toast('✅ Added');render();
}

        '<label class="btn btn-gray" style="flex:1;text-align:center;cursor:pointer">📤 Import<input type="file" accept=".json" onchange="importData(event)" style="display:none"></label>'+

function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='finance-backup-'+S.month+'.json';a.click();
  toast('📥 Exported!');
}
function importData(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const p=JSON.parse(ev.target.result);
      S=Object.assign({},S,p,{tab:'monthly',month:todayMon(),editIncome:false});
      if(!S.emiPaid)S.emiPaid={};if(!S.utilBills)S.utilBills={};if(!S.expenses)S.expenses={};
      save();toast('📤 Imported!');render();
    }catch{toast('❌ Invalid file','err');}
  };r.readAsText(f);
}

// ─── NAV & RENDER ─────────────────────────────────────────────────────────────
const TABS=[
  {id:'monthly', icon:'📆', label:'Monthly'},
  {id:'emis',    icon:'📅', label:'EMIs'},
  {id:'debts',   icon:'📉', label:'Debts'},
  {id:'utils',   icon:'🏠', label:'Utils'},
  {id:'overview',icon:'💵', label:'Overview'},
];

function render(){
  document.getElementById('monName').textContent=monLabel(S.month);
  const app=document.getElementById('app');
  switch(S.tab){
    case 'monthly':  app.innerHTML=renderMonthly();  break;
    case 'emis':     app.innerHTML=renderEmis();     break;
    case 'debts':    app.innerHTML=renderDebts();    break;
    case 'utils':    app.innerHTML=renderUtils();    break;
    case 'overview': app.innerHTML=renderOverview(); break;
    default:         app.innerHTML=renderMonthly();
  }
  document.getElementById('nav').innerHTML=TABS.map(t=>
    '<button class="nb '+(S.tab===t.id?'on':'')+'" onclick="S.tab=\''+t.id+'\';render()">'+
      '<span class="ni">'+t.icon+'</span><span class="nl">'+t.label+'</span>'+
    '</button>'
  ).join('');
  updSaved();
}

load();render();
setInterval(()=>{save();},30000);
</script>
